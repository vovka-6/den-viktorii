<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>День Виктории</title>
<meta name="description" content="Планировщик рабочего дня: занятия, подготовка, блог, дом и отдых. Работает без интернета, данные хранятся только на телефоне.">
<meta name="theme-color" content="#17766B">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self' blob:; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}
</style>
</head>
<body>
<style>
/* Layout: one-column phone planner — sticky day header, add box, timeline of blocks with free gaps */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9EFED; --ink:#1C2A2B; --muted:#5E6E70; --line:#D6DFDD;
  --accent:#17766B; --accent-ink:#FFFFFF; --warn:#B4541E; --warn-bg:#FBEDE3; --ok:#2F7D3B;
  --c-lesson:#17766B; --c-prep:#C88A12; --c-work:#6C5BC4; --c-blog:#2787F5; --c-home:#D45A4A; --c-rest:#4E9A4E; --c-other:#7A8790;
  --f-display:"Segoe UI", Roboto, "Google Sans", system-ui, -apple-system, sans-serif;
  --f-body:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111819; --surface:#1A2426; --surface-2:#223033; --ink:#E6EEEC; --muted:#9AAAAC; --line:#2E3D40;
  --accent:#3FB3A3; --accent-ink:#0D1A19; --warn:#F0A070; --warn-bg:#3A2619; --ok:#7CC487;
  --c-lesson:#3FB3A3; --c-prep:#E3AE42; --c-work:#9E90F0; --c-blog:#5AA6FF; --c-home:#F07D6E; --c-rest:#78C178; --c-other:#9AA7B0;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111819; --surface:#1A2426; --surface-2:#223033; --ink:#E6EEEC; --muted:#9AAAAC; --line:#2E3D40;
  --accent:#3FB3A3; --accent-ink:#0D1A19; --warn:#F0A070; --warn-bg:#3A2619; --ok:#7CC487;
  --c-lesson:#3FB3A3; --c-prep:#E3AE42; --c-work:#9E90F0; --c-blog:#5AA6FF; --c-home:#F07D6E; --c-rest:#78C178; --c-other:#9AA7B0;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:0 130px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.day{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:14px 10px; display:flex; flex-direction:column; gap:10px}
.dayrow{display:flex; align-items:center; gap:8px}
.dayrow h1{flex:1; min-width:0; margin:0; font-family:var(--f-display); font-weight:600; font-size:clamp(19px,5.4vw,24px); line-height:1.2; text-wrap:balance}
.dayrow h1 small{display:block; font-family:var(--f-body); font-weight:600; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.iconbtn{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none}
.iconbtn svg{width:18px; height:18px}
.todaybtn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 12px; font-size:14px; font-weight:600}
.load{display:flex; flex-direction:column; gap:6px}
.loadtext{display:flex; justify-content:space-between; gap:10px; font-size:14px; color:var(--muted); flex-wrap:wrap}
.loadtext b{color:var(--ink)}
.bar{display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--surface-2)}
.bar span{display:block; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12.5px; color:var(--muted)}
.legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px}

/* notices */
.notes{display:flex; flex-direction:column; gap:8px}
.note{background:var(--warn-bg); color:var(--ink); border-radius:12px; padding:10px 12px; font-size:14px; display:flex; gap:10px; align-items:flex-start}
.note::before{content:""; flex:none; width:8px; height:8px; margin-top:7px; border-radius:50%; background:var(--warn)}
.note.good{background:var(--surface-2)}
.note.good::before{background:var(--ok)}

/* add */
.add{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:12px}
.add label.big{font-weight:700; font-size:15px}
.field{width:100%; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:11px 12px; font-size:16px}
.suggest{display:flex; flex-direction:column; gap:10px}
.estimate{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.estimate .mins{font-family:var(--f-display); font-weight:600; font-size:22px; min-width:3.6em}
.why{font-size:13.5px; color:var(--muted)}
.step{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 11px; font-size:14px; font-weight:600}
.cats{display:flex; flex-wrap:wrap; gap:6px}
.cat{border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 11px 6px 9px; font-size:14px; display:inline-flex; align-items:center; gap:6px}
.cat i{width:9px; height:9px; border-radius:50%}
.cat[aria-pressed="true"]{background:var(--surface-2); border-color:var(--ink); font-weight:700}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row label{font-size:14px; color:var(--muted)}
.time{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 10px; font-size:15px}
.primary{background:var(--accent); color:var(--accent-ink); border:0; border-radius:12px; padding:12px 16px; font-weight:700; font-size:16px}
.ghost{background:transparent; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-weight:600; font-size:14px}
.linkbtn{background:none; border:0; padding:4px 0; color:var(--accent); font-weight:700; font-size:14px; text-align:left}
.check{display:flex; gap:8px; align-items:center; font-size:14px}
.check input{width:18px; height:18px; accent-color:var(--accent)}
.ai{font-size:13.5px; color:var(--muted)}

/* presets */
.presets{display:flex; flex-direction:column; gap:8px}
.presets h2, .sec h2{margin:0; font-size:13px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
.chip{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 11px; font-size:14px; text-align:left; display:flex; flex-direction:column; gap:1px}
.chip b{font-weight:600}
.chip span{font-size:12.5px; color:var(--muted)}
.chip i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px}

/* timeline */
.sec{display:flex; flex-direction:column; gap:8px}
.tl{display:flex; flex-direction:column; gap:6px}
.blk{display:grid; grid-template-columns:54px 1fr; gap:10px; align-items:stretch}
.when{font-size:14px; font-weight:700; padding-top:12px; text-align:right}
.when small{display:block; font-weight:500; color:var(--muted); font-size:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 10px 10px 12px; display:flex; gap:10px; align-items:flex-start; min-width:0}
.card .dot{width:10px; height:10px; border-radius:50%; margin-top:8px; flex:none}
.card .body{flex:1; min-width:0}
.card .t{font-weight:600; overflow-wrap:anywhere}
.card .m{font-size:13px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; margin-top:2px}
.pin{font-weight:700; color:var(--ink)}
.done .t{text-decoration:line-through; color:var(--muted)}
.done{opacity:.75}
.tick{width:30px; height:30px; flex:none; border-radius:50%; border:2px solid var(--line); background:transparent; display:grid; place-items:center; margin-top:2px}
.tick svg{width:16px; height:16px; opacity:0}
.done .tick{background:var(--accent); border-color:var(--accent)}
.done .tick svg{opacity:1; color:var(--accent-ink)}
.moves{display:flex; flex-direction:column; gap:2px}
.moves button{width:30px; height:26px; border:0; background:transparent; color:var(--muted); border-radius:8px}
.moves button:disabled{opacity:.25}
.gap{display:grid; grid-template-columns:54px 1fr; gap:10px}
.gap div:last-child{border:1px dashed var(--line); border-radius:12px; padding:6px 12px; font-size:13px; color:var(--muted)}
.now{display:grid; grid-template-columns:54px 1fr; gap:10px; align-items:center; color:var(--warn); font-size:12px; font-weight:700}
.now div:last-child{height:2px; background:var(--warn); border-radius:2px}
.actual{margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:14px}
.actual input{width:70px; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:6px 8px}
.empty{background:var(--surface); border:1px dashed var(--line); border-radius:var(--r); padding:18px; display:flex; flex-direction:column; gap:10px}
.empty p{margin:0; color:var(--muted)}
.over .card{border-style:dashed}
.rec{background:var(--warn); color:#fff}
.mic{font-weight:700}
.fab{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:15;
  min-width:min(330px, calc(100% - 32px)); height:68px; border-radius:999px; border:0; background:var(--accent); color:var(--accent-ink);
  font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:12px; box-shadow:0 8px 22px rgba(0,0,0,.28)}
.fab svg{width:28px; height:28px}
.listen{position:fixed; inset:auto 0 0 0; z-index:25; background:var(--surface); border-radius:22px 22px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.25);
  padding:20px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:14px; max-width:560px; margin:0 auto}
.listen h3{margin:0; font-family:var(--f-display); font-size:20px; display:flex; align-items:center; gap:10px}
.listen .live{min-height:72px; font-size:20px; line-height:1.4; background:var(--bg); border-radius:14px; padding:12px 14px; overflow-wrap:anywhere}
.listen .live:empty::before{content:"…"; color:var(--muted)}
.listen .big{height:60px; font-size:19px; border-radius:16px}
.pulse{width:14px; height:14px; border-radius:50%; background:var(--warn); flex:none}
@media (prefers-reduced-motion: no-preference){ .pulse{animation:pulse 1.2s ease-in-out infinite} @keyframes pulse{50%{opacity:.25; transform:scale(.7)}} }
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:16;
  width:min(528px, calc(100% - 32px)); background:var(--ink); color:var(--bg); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 8px 22px rgba(0,0,0,.28)}
.toast ul{margin:0; padding-left:18px}
.toast .row button{background:transparent; color:var(--bg); border:1px solid rgba(255,255,255,.45); border-radius:10px; padding:7px 12px; font-weight:700}
.tomorrow{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.tomorrow h2{margin:0; font-size:13px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700}
.tomorrow ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px}
.tomorrow li{display:flex; gap:10px; font-size:15px}
.tomorrow li b{min-width:46px}
.due{color:var(--warn); font-weight:700}
.plist{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:15px}
.plist li.miss{color:var(--warn)}
textarea.field{resize:vertical; min-height:64px; font-family:inherit}
.syncbox{display:flex; flex-direction:column; gap:8px}
.syncbox label{font-size:14px; color:var(--muted)}

/* sheet */
.scrim{position:fixed; inset:0; background:rgba(10,20,20,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:12px; max-height:92%; overflow:auto}
.sheet h3{margin:0; font-family:var(--f-display); font-weight:600; font-size:18px}
.sheet .actions{display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap}
.danger{color:var(--warn); border-color:var(--warn)}
.settings{display:grid; grid-template-columns:1fr auto; gap:10px 12px; align-items:center; font-size:15px}
.store{font-size:13.5px; color:var(--muted)}
footer{display:flex; flex-direction:column; gap:10px}
@media (prefers-reduced-motion: no-preference){ .tick, .cat, .chip{transition:background .15s, border-color .15s} }
</style>

<div class="wrap" id="app"></div>

<script>
(() => {
const CATS = {
  lesson:{name:"Занятия", short:"Занятие"},
  prep:{name:"Подготовка", short:"Подготовка"},
  work:{name:"Родители и отчёты", short:"Работа"},
  blog:{name:"Блог ВК", short:"Блог"},
  home:{name:"Дом", short:"Дом"},
  rest:{name:"Отдых", short:"Отдых"},
  other:{name:"Другое", short:"Другое"}
};
const CAT_ORDER = ["lesson","prep","work","blog","home","rest","other"];
const PRESETS = [
  ["Занятие с ребёнком","lesson",45], ["Подготовка к занятию","prep",20], ["Сделать пособие","prep",60],
  ["Консультация родителей","work",30], ["Записи после занятий","work",20],
  ["Пост в ВК","blog",60], ["Сторис","blog",15], ["Ответить на комментарии","blog",20],
  ["Приготовить обед","home",60], ["Уборка","home",45], ["Магазин","home",45],
  ["Прогулка","rest",45], ["Отдых, чай","rest",20]
];
const RULES = [
  [/диагност/, "work", 60, "диагностика обычно занимает около часа"],
  [/(консульт|родител|созвон|звонок|встреч)/, "work", 30, "разговор с родителями"],
  [/(отч[её]т|документ|заключени|характеристик|журнал)/, "work", 40, "работа с документами"],
  [/сторис/, "blog", 15, "сторис — короткий формат"],
  [/(видео|reels|рилс|ролик|монтаж)/, "blog", 90, "видео с монтажом"],
  [/(комментар|директ)/, "blog", 20, "ответы подписчикам"],
  [/(пост(\s|$|[аыуо])|(^|\s)вк(\s|$|[.,!?:])|вконтакт|блог|стать|публикац|контент)/, "blog", 60, "текст, картинка и публикация"],
  [/(подгот|материал|карточк|распечат|ламин|пособи|конспект|рабоч\S* лист)/, "prep", 30, "подготовка материалов"],
  [/(заняти|урок|сесси|коррекц|логопед|ребен|ребён|ученик)/, "lesson", 45, "одно занятие"],
  [/завтрак/, "home", 20, "завтрак"],
  [/(готов|обед|ужин|суп|выпеч|пирог)/, "home", 60, "готовка"],
  [/посуд/, "home", 15, "посуда"],
  [/(стирк|постир|бель[её])/, "home", 15, "загрузить и развесить"],
  [/глаж/, "home", 40, "глажка"],
  [/(убор|пылесос|(^|\s)пол(ы)?(\s|$)|порядок|пыль)/, "home", 45, "уборка"],
  [/(магазин|продукт|покуп|рынок)/, "home", 45, "дорога и покупки"],
  [/прогул/, "rest", 45, "прогулка"],
  [/(спорт|трениров|йог|зарядк|бассейн)/, "rest", 60, "тренировка"],
  [/(отдых|кофе|(^|\s)чай|книг|чита|сериал|фильм|ванн|поспать|медит)/, "rest", 30, "отдых"]
];
const DEFAULT_SETTINGS = {dayStart:"08:00", dayEnd:"21:00", gap:5, afterLesson:10};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMin = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const hhmm = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m/60)%24, mm = m%60; return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"); };
const dur = m => { m = Math.round(m); const h = Math.floor(m/60), mm = m%60; return h ? (mm ? `${h} ч ${mm} мин` : `${h} ч`) : `${mm} мин`; };
const r5 = m => Math.max(5, Math.round(m/5)*5);
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate()+n); return dkey(d); };
const norm = s => String(s).toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9\s]/g," ").replace(/\s+/g," ").trim().slice(0,60);
const uid = () => Math.random().toString(36).slice(2,10);
const safeCat = c => (Object.prototype.hasOwnProperty.call(CATS, c) ? c : "other");
const color = c => `var(--c-${safeCat(c)})`;

/* ---------- storage on the device ---------- */
const LSP = "den-viktorii:";
const lsGet = k => { try { const v = localStorage.getItem(LSP+k); return v ? JSON.parse(v) : null; } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(LSP+k, JSON.stringify(v)); } catch(e) {} };
/* ---------- local store (single source on the device) ---------- */
const lsDel = k => { try { localStorage.removeItem(LSP+k); } catch(e) {} };
const DOC_RE = /^(settings|stats|recurring|day-\d{4}-\d{2}-\d{2})$/;
const store = {
  mode:"local", watchers:{},
  watch(id, cb){ this.watchers[id] = cb; cb(lsGet(id)); },
  unwatch(id){ delete this.watchers[id]; },
  save(id, data){ lsSet(id, {...data, _m:Date.now()}); SYNC.schedule(); return Promise.resolve(); },
  refresh(){ for (const [id, cb] of Object.entries(this.watchers)) cb(lsGet(id)); }
};
function localDocs(){
  const out = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i);
    if (k && k.startsWith(LSP) && DOC_RE.test(k.slice(LSP.length))) out[k.slice(LSP.length)] = lsGet(k.slice(LSP.length)); } } catch(e) {}
  return out;
}
function sanitizeDoc(id, d){
  const m = Number(d && d._m) || 0;
  if (id === "settings") return {...cleanSettings(d), _m:m};
  if (id === "stats") return {...cleanStats(d), _m:m};
  if (id === "recurring") return {...cleanRecurring(d), _m:m};
  return {date:id.slice(4), tasks:(d && Array.isArray(d.tasks) ? d.tasks : []).map(cleanTask).filter(Boolean), skip:cleanSkip(d && d.skip), _m:m};
}

/* ---------- sync: one encrypted file in the owner's private GitHub repository ---------- */
const SYNC_FILE = "planner.enc.json";
const REPO_RE = /^[A-Za-z0-9-]{1,39}\/[A-Za-z0-9._-]{1,100}$/;
const b64 = bytes => { const a = new Uint8Array(bytes); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, saltB64){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:unb64(saltB64), iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);

}
const importKey = raw => crypto.subtle.importKey("raw", unb64(raw), {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
async function seal(keyRaw, saltB64, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await importKey(keyRaw), new TextEncoder().encode(JSON.stringify(obj)));
  return {app:"den-viktorii", v:1, salt:saltB64, iv:b64(iv), ct:b64(ct)};
}
async function unseal(keyRaw, env){

class SyncError extends Error { constructor(msg, kind){ super(msg); this.kind = kind; } }
const ghHeaders = token => ({"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"});
function httpError(status){
  if (status === 401) return new SyncError("Ключ доступа не подходит или его срок истёк. Создайте новый ключ и подключите синхронизацию заново.", "auth");
  if (status === 403) return new SyncError("Ключу не хватает прав. Нужен доступ «Contents: Read and write» к репозиторию с данными.", "auth");
  if (status === 404) return new SyncError("Репозиторий не найден или ключ к нему не подходит. Проверьте название вида «имя/репозиторий».", "auth");

async function ghFetch(url, opts){

  catch(e) { throw new SyncError("Нет связи с интернетом — синхронизирую, когда она появится.", "offline"); }

async function getRemote(repo, token){
  const r = await ghFetch(`https://api.github.com/repos/${repo}/contents/${SYNC_FILE}`, {headers:ghHeaders(token)});

  if (!r.ok) throw httpError(r.status);
  const j = await r.json();

  try { env = JSON.parse(atob(String(j.content || "").replace(/\s/g, ""))); } catch(e) {}
  if (!env || env.app !== "den-viktorii" || !env.salt || !env.iv || !env.ct) throw new SyncError("В репозитории лежит не файл планировщика. Используйте отдельный пустой репозиторий.", "auth");

}
const SYNC = {
  cfg:null, busy:false, again:false, timer:null, status:"", ok:true,
  load(){ const c = lsGet("sync"); this.cfg = (c && REPO_RE.test(c.repo) && c.token && c.key && c.salt) ? c : null; },
  enabled(){ return !!this.cfg; },
  schedule(){ if (!this.cfg) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 2500); },
  async run(){
    if (!this.cfg) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    const {repo, token, key, salt} = this.cfg;
    try {
      const remote = await getRemote(repo, token);
      let rdocs = {};
      if (remote.exists) {
        if (remote.env.salt !== salt) throw new SyncError("Данные в репозитории зашифрованы другим паролем. Отключите синхронизацию и подключите заново с тем же паролем, что на другом устройстве.", "auth");
        try { rdocs = (await unseal(key, remote.env)).docs || {}; }
        catch(e) { throw new SyncError("Не удалось расшифровать данные: пароль не подходит.", "auth"); }
      }
      const ldocs = localDocs();
      let changedLocal = false, needPush = !remote.exists;
      for (const id of new Set([...Object.keys(ldocs), ...Object.keys(rdocs)])) {
        if (!DOC_RE.test(id)) continue;
        const l = ldocs[id], r = rdocs[id];
        const lm = Number(l && l._m) || 0, rm = Number(r && r._m) || 0;
        if (r && (!l || rm > lm)) { lsSet(id, sanitizeDoc(id, r)); changedLocal = true; }
        else if (l && (!r || lm > rm)) needPush = true;
      }
      if (needPush) {
        const env = await seal(key, salt, {docs:localDocs()});
        const body = {message:"Обновление данных планировщика", content:btoa(JSON.stringify(env))};
        if (remote.sha) body.sha = remote.sha;
        const r = await ghFetch(`https://api.github.com/repos/${repo}/contents/${SYNC_FILE}`, {method:"PUT", headers:{...ghHeaders(token), "Content-Type":"application/json"}, body:JSON.stringify(body)});
        if (r.status === 409 || r.status === 422) this.again = true;        // the other device saved at the same moment
        else if (!r.ok) throw httpError(r.status);
      }
      const now = new Date();
      lsSet("syncLast", now.toISOString());
      this.ok = true; this.status = `Синхронизировано в ${hhmm(now.getHours()*60 + now.getMinutes())}`;
      if (changedLocal) store.refresh();
    } catch(e) {
      this.ok = e.kind === "offline"; this.status = e.message || "Синхронизация не удалась.";
    } finally {
      this.busy = false;
      if (!S.editing && !S.showSettings) render();
      if (this.again) { this.again = false; this.schedule(); }
    }
  },
  async connect(repo, token, pass){
    repo = String(repo || "").trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/+$/, "");
    token = String(token || "").trim();
    if (!REPO_RE.test(repo)) throw new SyncError("Название репозитория должно быть вида «имя/репозиторий», например vovka-6/den-viktorii-data.");
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(token)) throw new SyncError("Ключ доступа должен начинаться с github_pat_ — скопируйте его целиком.");
    if (String(pass || "").length < 6) throw new SyncError("Пароль — минимум 6 символов.");
    const rr = await ghFetch(`https://api.github.com/repos/${repo}`, {headers:ghHeaders(token)});
    if (!rr.ok) throw httpError(rr.status);
    const info = await rr.json();
    if (!info.private) throw new SyncError("Этот репозиторий открытый. Для данных нужен закрытый (Private) репозиторий.");
    const remote = await getRemote(repo, token);
    let salt, key;
    if (remote.exists) {
      salt = remote.env.salt; key = await deriveKey(pass, salt);
      try { await unseal(key, remote.env); } catch(e) { throw new SyncError("Пароль не подходит к уже сохранённым данным. Введите тот же пароль, что и на другом устройстве."); }
    } else {
      salt = b64(crypto.getRandomValues(new Uint8Array(16))); key = await deriveKey(pass, salt);
    }
    this.cfg = {repo, token, key, salt};
    lsSet("sync", this.cfg);
    await this.run();
  },
  disconnect(){ this.cfg = null; lsDel("sync"); this.status = ""; }
};

/* ---------- recurring tasks ---------- */
const DOW_SHORT = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const DOW_ORDER = [1,2,3,4,5,6,0];
const daysLabel = days => { const set = new Set(days);
  if (set.size === 7) return "каждый день";
  if (set.size === 5 && [1,2,3,4,5].every(x => set.has(x))) return "по будням";
  if (set.size === 2 && set.has(6) && set.has(0)) return "по выходным";
  return DOW_ORDER.filter(x => set.has(x)).map(x => DOW_SHORT[x]).join(", "); };
function materialize(date, tasks, skip){
  const items = (S.recurring && S.recurring.items) || [];
  const dow = fromKey(date).getDay(), today = dkey(new Date());
  let out = tasks.map(t => ({...t})), changed = false;
  const want = new Map();
  for (const r of items) {
    if (!r.days.includes(dow) || date < r.from) continue;
    want.set(r.id, {r, prep:false});
    if (r.prep && r.cat === "lesson") want.set(r.id + "p", {r, prep:true});
  }
  for (const [rid, {r, prep}] of want) {
    if (skip.includes(rid)) continue;
    const ex = out.find(t => t.rid === rid);
    const tpl = prep ? {title:"Подготовка: " + r.title, cat:"prep", min:20, fixed:""} : {title:r.title, cat:r.cat, min:r.min, fixed:r.fixed};
    if (!ex) { out.push({id:uid(), rid, ...tpl, done:false}); changed = true; }
    else if (!ex.done && !ex.custom && (ex.title !== tpl.title || ex.cat !== tpl.cat || ex.min !== tpl.min || ex.fixed !== tpl.fixed)) { Object.assign(ex, tpl); changed = true; }
  }
  if (date >= today) {
    const before = out.length;
    out = out.filter(t => !t.rid || t.done || want.has(t.rid));
    if (out.length !== before) changed = true;
  }
  return {tasks:out, changed};
}
function loadDay(date){
  const d = lsGet(dayId(date));
  const tasks = d && Array.isArray(d.tasks) ? d.tasks.map(cleanTask).filter(Boolean) : [];
  const skip = cleanSkip(d && d.skip);
  const m = materialize(date, tasks, skip);
  return {tasks:m.tasks, skip, changed:m.changed};
}
function saveRecurring(){ store.save("recurring", S.recurring); }
function refreshToday(){
  if (!S.dayLoaded) return;
  const m = materialize(S.date, S.tasks, S.skip);
  if (m.changed) { S.tasks = m.tasks; saveDay(); }
}
function addRecurring(r){
  const item = {id:uid(), title:r.title, cat:safeCat(r.cat), min:r5(r.min), fixed:r.fixed || "", days:r.days, prep:!!r.prep, from:dkey(new Date())};
  S.recurring = {items:[...S.recurring.items, item]}; saveRecurring(); return item;
}
function removeRecurring(id){
  S.recurring = {items:S.recurring.items.filter(r => r.id !== id)}; saveRecurring(); refreshToday();
}

/* ---------- voice input: on-device speech recognition (Vosk, WebAssembly) ---------- */
const MODEL_FILE = "vosk-model-small-ru-0.22.tar.gz";
const VOICE = {model:null, rec:null, ctx:null, stream:null, node:null, src:null, state:"idle", base:"", final:"", partial:"", msg:""};
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("script")); document.head.appendChild(el); }); }
function voiceCleanup(){
  try { VOICE.node && VOICE.node.disconnect(); } catch(e) {}
  try { VOICE.src && VOICE.src.disconnect(); } catch(e) {}
  try { VOICE.stream && VOICE.stream.getTracks().forEach(t => t.stop()); } catch(e) {}
  try { VOICE.ctx && VOICE.ctx.close(); } catch(e) {}
  try { VOICE.rec && VOICE.rec.remove(); } catch(e) {}
  VOICE.node = VOICE.src = VOICE.stream = VOICE.ctx = VOICE.rec = null;
}
async function voiceStart(){
  if (VOICE.state !== "idle") return;
  S.toast = null; VOICE.msg = ""; VOICE.final = ""; VOICE.partial = ""; VOICE.base = "";
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !window.WebAssembly) {
    VOICE.state = "error"; VOICE.msg = "Этот браузер не умеет записывать с микрофона. Откройте приложение в Chrome."; render(); return;
  }
  try {
    VOICE.state = "loading";
    if (!window.Vosk) { VOICE.msg = "Загружаю распознавание речи…"; render(); await loadScript("vosk.js"); }
    if (!VOICE.model) {
      VOICE.msg = lsGet("voiceReady") ? "Готовлю распознавание…" : "Первый запуск: скачиваю модель речи (46 МБ) — подождите 1–3 минуты. Дальше голос работает без интернета.";
      render();
      VOICE.model = await window.Vosk.createModel(new URL(MODEL_FILE, location.href).href);
      lsSet("voiceReady", 1);
    }
    if (VOICE.state !== "loading") return;                 // cancelled while loading
    VOICE.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, channelCount:1}, video:false});
    VOICE.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const rec = new VOICE.model.KaldiRecognizer(VOICE.ctx.sampleRate);
    rec.on("result", m => { const t = (m && m.result && m.result.text) || ""; if (t) VOICE.final += (VOICE.final ? " " : "") + t; VOICE.partial = ""; showVoiceText(); });
    rec.on("partialresult", m => { VOICE.partial = (m && m.result && m.result.partial) || ""; showVoiceText(); });
    VOICE.rec = rec;
    VOICE.src = VOICE.ctx.createMediaStreamSource(VOICE.stream);
    VOICE.node = VOICE.ctx.createScriptProcessor(4096, 1, 1);
    VOICE.node.onaudioprocess = e => { try { rec.acceptWaveform(e.inputBuffer); } catch(err) {} };
    VOICE.src.connect(VOICE.node); VOICE.node.connect(VOICE.ctx.destination);
    VOICE.state = "listening"; VOICE.msg = "";
    render();
  } catch(e) {
    voiceCleanup(); VOICE.state = "error";
    VOICE.msg = (e && (e.name === "NotAllowedError" || e.name === "SecurityError"))
      ? "Нет доступа к микрофону. Разрешите микрофон для этого сайта: ⋮ → Настройки сайта → Микрофон."
      : (lsGet("voiceReady") ? "Не получилось включить микрофон. Попробуйте ещё раз." : "Не получилось скачать модель речи. При первом включении нужен интернет — попробуйте ещё раз.");
    render();
  }
}
function voiceText(){ return (VOICE.final + (VOICE.partial ? (VOICE.final ? " " : "") + VOICE.partial : "")).replace(/\s+/g, " ").trim(); }
function voiceCancel(){ voiceCleanup(); VOICE.state = "idle"; VOICE.msg = ""; VOICE.final = ""; VOICE.partial = ""; render(); }
function snapshotFor(actions){
  const ids = new Set(["recurring"]);
  for (const a of actions) { if (a.date) ids.add(dayId(a.date)); if (a.toDate) ids.add(dayId(a.toDate)); }
  ids.add(dayId(S.date));
  const snap = {}; for (const id of ids) snap[id] = lsGet(id);

}
function undoSnapshot(snap){
  for (const [id, d] of Object.entries(snap)) {
    if (id === "recurring") store.save(id, d ? {items:cleanRecurring(d).items} : {items:[]});
    else store.save(id, d ? {date:id.slice(4), tasks:(d.tasks || []).map(cleanTask).filter(Boolean), skip:cleanSkip(d.skip)} : {date:id.slice(4), tasks:[], skip:[]});

async function voiceStop(){
  if (VOICE.state !== "listening") return;
  VOICE.state = "finishing"; render();
  const lastPartial = VOICE.partial, finalBefore = VOICE.final;

  if (VOICE.final === finalBefore && lastPartial) VOICE.final += (VOICE.final ? " " : "") + lastPartial;   // final result was late: keep what was heard

  const text = voiceText();
  voiceCleanup(); VOICE.state = "idle"; VOICE.final = "";
  if (!text) { VOICE.state = "error"; VOICE.msg = "Не расслышала. Нажмите «Сказать задачу» и говорите чуть ближе к телефону."; render(); return; }
  const actions = parsePhrase(text);
  const ok = actions.length && actions.every(a => a.type !== "miss");
  if (ok) {
    const snap = snapshotFor(actions);
    const r = applyActions(actions);
    S.toast = {lines:actions.map(describe).map(x => x.replace(/^Добавить: /, "")), undo:snap, date:r.firstDate, heard:text};
    render();
  } else {
    S.phraseText = text; S.phrase = actions; render();
    const box = document.querySelector('[aria-label="Сказать одной фразой"]'); if (box && box.scrollIntoView) box.scrollIntoView({block:"start", behavior:"smooth"});
  }
}
function showVoiceText(){ const el = document.getElementById("live-text"); if (el) el.textContent = voiceText(); }

/* ---------- one-phrase input (voice via the keyboard microphone, or typed) ---------- */
const WEEKDAY_STEMS = [["воскресень",0],["понедельник",1],["вторник",2],["сред",3],["четверг",4],["пятниц",5],["суббот",6]];
function relLabel(k){
  const t = dkey(new Date());
  if (k === t) return "сегодня"; if (k === addDays(t,1)) return "завтра"; if (k === addDays(t,2)) return "послезавтра";
  return fromKey(k).toLocaleDateString("ru-RU", {weekday:"short", day:"numeric", month:"long"});
}
const MONTHS_GEN = {"января":0,"февраля":1,"марта":2,"апреля":3,"мая":4,"июня":5,"июля":6,"августа":7,"сентября":8,"октября":9,"ноября":10,"декабря":11};

  let m;
  if ((m = s.match(/(^|\s)послепослезавтра(?=\s|$)/))) return hit(m, addDays(today, 3), "rel");
  if ((m = s.match(/(^|\s)послезавтра(?=\s|$)/))) return hit(m, addDays(today, 2), "rel");
  if ((m = s.match(/(^|\s)завтра(?=\s|$)/))) return hit(m, addDays(today, 1), "rel");
  if ((m = s.match(/(^|\s)сегодня(?=\s|$)/))) return hit(m, today, "rel");

  if ((m = s.match(/(^|\s)через\s+(\d{1,3})\s+(?:дн\S*|день|сут\S*)(?=\s|$)/))) return hit(m, addDays(today, Number(m[2])), "rel");
  if ((m = s.match(/(^|\s)через\s+(?:(\d{1,2})\s+)?недел\S*(?=\s|$)/))) return hit(m, addDays(today, 7 * (Number(m[2]) || 1)), "rel");

  }
  // "25-го", "25-го числа", "25 числа" (this month, or next month if already passed)
  if ((m = s.match(/(^|\s)(?:на\s+|в\s+)?(\d{1,2})(?:\s*-?\s*(?:го|е|ое)(?:\s+числа)?|\s+числа)(?=\s|$)/))) {
    const d = Number(m[2]), t = fromKey(today);
    if (d >= 1 && d <= 31) {
      let dt = new Date(t.getFullYear(), t.getMonth(), d);
      if (dt.getDate() !== d || dkey(dt) < today) { dt = new Date(t.getFullYear(), t.getMonth() + 1, d); }

const prevWord = (s, idx) => s.slice(0, idx).trim().split(/\s+/).pop() || "";

  if ((m = s.match(/(?:^|\s)(?:на\s+)?полчаса(?=\s|$)/))) return {min:30, rest:cut(m)};
  if ((m = s.match(/(?:^|\s)на\s+час(?=\s|$)/))) return {min:60, rest:cut(m)};

  if (Number(t.actual) > 0) out.actual = Math.min(600, Math.round(Number(t.actual)));
  if (DATE_RE_T.test(t.due)) out.due = t.due;
  const rid = String(t.rid || "").replace(/[^a-z0-9]/gi, "").slice(0, 20);
  if (rid) { out.rid = rid; if (t.custom) out.custom = true; }
  return out;
}
const cleanSkip = a => Array.isArray(a) ? a.map(x => String(x).replace(/[^a-z0-9]/gi, "").slice(0, 20)).filter(Boolean).slice(0, 200) : [];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function cleanRecurring(d){
  const items = [];
  for (const r of (d && Array.isArray(d.items) ? d.items : []).slice(0, 100)) {
    if (!r || typeof r !== "object") continue;
    const id = String(r.id || "").replace(/[^a-z0-9]/gi, "").slice(0, 16); if (!id) continue;
    const days = [...new Set((Array.isArray(r.days) ? r.days : []).map(Number).filter(x => Number.isInteger(x) && x >= 0 && x <= 6))].sort();
    const title = String(r.title || "").slice(0, 200).trim();
    if (!days.length || !title) continue;
    items.push({id, title, cat:safeCat(r.cat), min:r5(clampNum(r.min, 5, 600, 30)), fixed:TIME_RE.test(r.fixed) ? r.fixed : "",
      days, prep:!!r.prep, from:DATE_RE.test(r.from) ? r.from : dkey(new Date())});
  }
  return {items};
}
function cleanSettings(d){
  d = d || {};
  return {dayStart:TIME_RE.test(d.dayStart) ? d.dayStart : DEFAULT_SETTINGS.dayStart,
    dayEnd:TIME_RE.test(d.dayEnd) ? d.dayEnd : DEFAULT_SETTINGS.dayEnd,
    gap:clampNum(d.gap, 0, 60, DEFAULT_SETTINGS.gap), afterLesson:clampNum(d.afterLesson, 0, 60, DEFAULT_SETTINGS.afterLesson)};
}
function cleanStats(d){
  const items = {};
  if (d && d.items && typeof d.items === "object") for (const [k, v] of Object.entries(d.items)) {
    if (v && Number(v.n) > 0 && Number(v.avg) > 0) items[String(k).slice(0, 60)] = {n:Math.round(Number(v.n)), avg:Number(v.avg), cat:safeCat(v.cat)};
  }
  return {items};
}
function learn(task, actual){
  const k = norm(task.title); if (!k || !actual) return;
  const items = {...(S.stats.items || {})};
  const cur = items[k] || {n:0, avg:0, cat:task.cat};
  const n = Math.min(cur.n + 1, 10);           // recent experience weighs more
  const avg = cur.n ? cur.avg + (actual - cur.avg) / n : actual;
  items[k] = {n:cur.n + 1, avg:Math.round(avg*10)/10, cat:task.cat};
  const keys = Object.keys(items);
  if (keys.length > 300) keys.sort((a,b) => items[a].n - items[b].n).slice(0, keys.length-300).forEach(x => delete items[x]);
  S.stats = {items};
  saveStats();
}

/* ---------- scheduling ---------- */
function schedule(){
  const st = S.settings, start = toMin(st.dayStart), end = toMin(st.dayEnd);
  const gap = Number(st.gap)||0, after = Number(st.afterLesson)||0;
  const tail = t => gap + (t.cat === "lesson" ? after : 0);
  const fixed = S.tasks.filter(t => t.fixed).map(t => ({t, s:toMin(t.fixed), e:toMin(t.fixed)+t.min})).sort((a,b) => a.s-b.s);
  const flex = S.tasks.filter(t => !t.fixed);
  // free windows between fixed blocks
  let free = [{s:start, e:end}];
  for (const f of fixed) {
    const blockS = f.s, blockE = f.e + tail(f.t);
    free = free.flatMap(w => {
      if (blockE <= w.s || blockS >= w.e) return [w];
      const out = [];
      if (blockS > w.s) out.push({s:w.s, e:blockS - gap});
      if (blockE < w.e) out.push({s:blockE, e:w.e});
      return out;
    }).filter(w => w.e > w.s);
  }
  const placed = fixed.map(f => ({t:f.t, s:f.s, e:f.e, fixed:true}));
  const over = [];
  // today: what is done stays from the morning, what is left is planned from now on
  const isToday = S.date === dkey(new Date());
  const now = isToday ? Math.ceil((new Date().getHours()*60 + new Date().getMinutes())/5)*5 : -1;
  // a preparation task belongs before its lesson: same recurring id + "p", or "Подготовка: <lesson title>"
  const lessonOf = t => {
    if (t.rid && t.rid.endsWith("p")) { const l = S.tasks.find(x => x.rid === t.rid.slice(0, -1) && x.fixed); if (l) return l; }
    const m = /^подготовка:\s*(.+)$/i.exec(t.title);
    return m ? S.tasks.find(x => x.fixed && x.cat === "lesson" && norm(x.title) === norm(m[1])) : null;
  };
  const deadline = new Map();
  for (const t of flex) { const l = lessonOf(t); if (l) deadline.set(t.id, toMin(l.fixed) - gap); }
  const byDeadline = (a, b) => (deadline.has(a.id) ? deadline.get(a.id) : 1e9) - (deadline.has(b.id) ? deadline.get(b.id) : 1e9);
  const undone = flex.filter(t => !t.done);
  const order = isToday
    ? [...flex.filter(t => t.done), ...undone.filter(t => deadline.has(t.id)).sort(byDeadline), ...undone.filter(t => !deadline.has(t.id))]
    : [...flex.filter(t => deadline.has(t.id)).sort(byDeadline), ...flex.filter(t => !deadline.has(t.id))];
  const late = new Set();
  for (const t of order) {
    const from = (isToday && !t.done) ? now : -1;
    const dl = (!t.done && deadline.has(t.id)) ? deadline.get(t.id) : null;
    let w = dl !== null ? free.find(w => Math.min(w.e, end, dl) - Math.max(w.s, from) >= t.min) : null;
    if (!w) { w = free.find(w => Math.min(w.e, end) - Math.max(w.s, from) >= t.min && w.e - w.s >= t.min); if (w && dl !== null) late.add(t.id); }
    if (!w) { over.push(t); continue; }
    const s = Math.max(w.s, from);
    placed.push({t, s, e:s + t.min, fixed:false});
    if (s > w.s) free.push({s:w.s, e:s - gap});            // keep the part of the window before the task usable
    w.s = s + t.min + tail(t);
  }
  free.sort((a, b) => a.s - b.s);
  placed.sort((a,b) => a.s - b.s || (a.fixed ? -1 : 1));
  // overlaps between fixed tasks
  const clash = new Set();
  for (let i = 1; i < fixed.length; i++) if (fixed[i].s < fixed[i-1].e) { clash.add(fixed[i].t.id); clash.add(fixed[i-1].t.id); }
  return {placed, over, clash, late, start, end};
}

function analyse(plan){
  const notes = [];
  const total = S.tasks.reduce((a,t) => a + t.min, 0);
  const avail = plan.end - plan.start;
  if (plan.over.length) notes.push({warn:true, text:`Не помещается: ${plan.over.length} ${plural(plan.over.length,"задача","задачи","задач")} на ${dur(plan.over.reduce((a,t)=>a+t.min,0))}. Перенесите на другой день или сократите время.`});
  if (plan.late && plan.late.size) notes.push({warn:true, text:"Подготовка к занятию не помещается до его начала — освободите время утром или перенесите подготовку на вчерашний вечер."});
  if (plan.clash.size) notes.push({warn:true, text:"Задачи с точным временем пересекаются — проверьте отмеченные."});
  const work = S.tasks.filter(t => !["rest","home"].includes(t.cat)).reduce((a,t)=>a+t.min,0);
  const rest = S.tasks.filter(t => t.cat === "rest").reduce((a,t)=>a+t.min,0);
  if (total >= 240 && rest === 0) notes.push({warn:true, text:"В плане нет отдыха. Добавьте хотя бы 20–30 минут — прогулку или чай."});
  // long stretch without a break
  let runS = null, runE = null, longest = 0, longestAt = null;
  const nowM = S.date === dkey(new Date()) ? new Date().getHours()*60 + new Date().getMinutes() : -1;
  for (const p of plan.placed.filter(p => p.e > nowM && !p.t.done)) {
    if (p.t.cat === "rest") { runS = null; continue; }
    if (runS !== null && p.s - runE <= 15) { runE = Math.max(runE, p.e); }
    else { runS = p.s; runE = p.e; }
    if (runE - runS > longest) { longest = runE - runS; longestAt = runS; }
  }
  if (longest > 180) notes.push({warn:true, text:`С ${hhmm(longestAt)} больше ${dur(longest)} подряд без паузы. Вставьте перерыв 15 минут.`});
  const lessons = S.tasks.filter(t => t.cat === "lesson").length;
  const preps = S.tasks.filter(t => t.cat === "prep").length;
  if (lessons > 0 && preps === 0) notes.push({warn:true, text:`${lessons} ${plural(lessons,"занятие","занятия","занятий")}, но нет подготовки. Обычно на одно занятие уходит 15–20 минут подготовки.`});
  if (!notes.length && S.tasks.length) notes.push({warn:false, text: total <= avail ? `День сбалансирован: свободно ${dur(Math.max(0, avail - total - S.tasks.length*(Number(S.settings.gap)||0)))}.` : "План собран."});
  return {notes, total, avail, work, rest};
}

function updateDraftEstimate(){
  const d = S.draft;
  if (!d.title.trim()) { d.cat = d.catManual ? d.cat : null; if (!d.minManual) d.min = null; d.why = ""; return; }
  const e = estimate(d.title);
  if (!d.catManual) d.cat = e.cat;
  if (!d.minManual) d.min = e.min;
  d.why = d.ai ? d.ai : e.why;
}
function addTask(title, cat, min, fixed){
  S.tasks.push({id:uid(), title:title.trim(), cat:cat||"other", min:r5(min||30), fixed:fixed||"", done:false});
}
function submitDraft(){
  const d = S.draft; if (!d.title.trim()) { $("#title")?.focus(); return; }
  updateDraftEstimate();
  if (d.cat === "lesson" && d.withPrep && !S.tasks.some(t => norm(t.title) === norm("Подготовка: " + d.title))) {
    const pe = estimate("Подготовка к занятию");
    S.tasks.push({id:uid(), title:"Подготовка: " + d.title.trim(), cat:"prep", min:pe.cat === "prep" ? pe.min : 20, fixed:"", done:false});
  }
  addTask(d.title, d.cat, d.min, d.fixed);
  S.draft = {title:"", cat:null, min:null, fixed:"", catManual:false, minManual:false, withPrep:true, ai:null, why:""};
  S.aiMsg = "";
  saveDay(); render(); $("#title")?.focus();
}
function addPreset(i){
  const [title, cat] = PRESETS[i];
  const e = estimate(title);
  addTask(title, cat, e.min, "");
  saveDay(); render();
}
function toggleDone(id){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done;
  if (t.done) S.askingDone = id; else { S.askingDone = null; delete t.actual; }
  saveDay(); render();
}
function saveActual(id, val){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const v = Math.max(1, Math.min(600, Math.round(Number(val)||t.min)));
  t.actual = v; learn(t, v); S.askingDone = null; saveDay(); render();
}
function move(id, dir){
  const flex = S.tasks.filter(t => !t.fixed);
  const i = flex.findIndex(t => t.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= flex.length) return;
  const a = S.tasks.indexOf(flex[i]), b = S.tasks.indexOf(flex[j]);
  [S.tasks[a], S.tasks[b]] = [S.tasks[b], S.tasks[a]];
  saveDay(); render();
}
function goDate(k){ store.unwatch(dayId(S.date)); S.dayLoaded = false; S.date = k; S.askingDone = null; watchDay(); render(); window.scrollTo({top:0}); }
async function carryOver(){
  const left = S.tasks.filter(t => !t.done);
  if (!left.length) return;
  const next = addDays(S.date, 1);
  const existing = (lsGet(dayId(next)) || {}).tasks || [];
  let nextTasks = existing;
  const moved = left.map(t => { const c = {...t, id:uid(), fixed:""}; delete c.rid; delete c.custom; return c; });
  left.forEach(t => { if (t.rid) S.skip.push(t.rid); });
  await store.save(dayId(next), {date:next, tasks:[...nextTasks.map(t => ({...t})), ...moved]});
  S.tasks = S.tasks.filter(t => t.done);
  saveDay();
  S.flash = `Перенесено на завтра: ${moved.length}`;
  render();
}

function tomorrowCard(){
  const today = dkey(new Date());
  if (S.date !== today) return "";
  const tmr = addDays(today, 1);
  const list = loadDay(tmr).tasks.filter(t => !t.done);
  const dueSoon = S.tasks.filter(t => !t.done && t.due && t.due <= tmr);
  if (!list.length && !dueSoon.length) return "";
  const sorted = [...list.filter(t => t.fixed).sort((a, b) => a.fixed < b.fixed ? -1 : 1), ...list.filter(t => !t.fixed)];
  const shown = sorted.slice(0, 5);
  const label = fromKey(tmr).toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});
  return `<section class="tomorrow" aria-label="Завтра">
    ${dueSoon.length ? `<div class="note" style="margin:0"><span><b>До завтра нужно сделать:</b> ${dueSoon.map(t => esc(t.title)).join(", ")}</span></div>` : ""}
    ${list.length ? `<h2>Завтра, ${esc(label)} · ${Number(list.length)} ${plural(list.length, "дело", "дела", "дел")}</h2>
    <ul>${shown.map(t => `<li><b class="num">${t.fixed ? esc(t.fixed) : "—"}</b><span>${esc(t.title)}${t.due ? ` <span class="due">срок: ${esc(relLabel(t.due))}</span>` : ""}</span></li>`).join("")}</ul>
    ${sorted.length > shown.length ? `<div class="why">и ещё ${sorted.length - shown.length}</div>` : ""}
    <div class="row"><button class="linkbtn" data-act="next">Открыть завтра →</button></div>` : ""}
  </section>`;
}

function backupText(){
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i);
    if (k && k.startsWith(LSP) && /^(settings|stats|day-\d{4}-\d{2}-\d{2})$/.test(k.slice(LSP.length))) data[k.slice(LSP.length)] = lsGet(k.slice(LSP.length)); } } catch(e) {}
  return JSON.stringify({app:"den-viktorii", v:1, at:dkey(new Date()), data});
}
function doBackup(){
  const text = backupText();
  const done = ok => { if (ok) { lsSet("lastBackup", dkey(new Date())); S.backupMsg = "Копия скопирована. Вставьте её в заметки или отправьте себе в мессенджер."; }
    else { S.backupMsg = "Не получилось скопировать автоматически. Текст копии — в поле выше: выделите его и скопируйте."; }
    render(); if (!ok) { const t = document.getElementById("backup-text"); if (t) { t.value = text; t.focus(); t.select(); } } };
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch(e) { done(false); }
}
function doRestore(){
  const raw = (document.getElementById("backup-text") || {}).value || "";
  let obj = null; try { obj = JSON.parse(raw.trim()); } catch(e) {}
  if (!obj || obj.app !== "den-viktorii" || !obj.data || typeof obj.data !== "object") { S.backupMsg = "Это не похоже на копию планировщика. Вставьте текст целиком."; render(); return; }
  let n = 0;
  for (const [k, v] of Object.entries(obj.data)) {
    if (DOC_RE.test(k) && v && typeof v === "object") { lsSet(k, {...sanitizeDoc(k, v), _m:Date.now()}); n++; }
  }
  S.settings = cleanSettings(lsGet("settings")); S.stats = cleanStats(lsGet("stats")); S.recurring = cleanRecurring(lsGet("recurring"));
  { const L = loadDay(S.date); S.tasks = L.tasks; S.skip = L.skip; S.dayLoaded = true; if (L.changed) saveDay(); }
  SYNC.schedule();
  S.backupMsg = `Восстановлено: ${n} ${plural(n,"запись","записи","записей")}.`;
  render();
}

/* ---------- events ---------- */
document.addEventListener("input", e => {
  if (e.target.id === "phrase") { const had = !!S.phraseText.trim(); S.phraseText = e.target.value; if (S.phrase || had !== !!S.phraseText.trim()) { S.phrase = null; render(); } return; }
  if (e.target.id === "title") {
    const had = !!S.draft.title.trim();
    S.draft.title = e.target.value; S.draft.ai = null;
    updateDraftEstimate();
    if (had !== !!S.draft.title.trim()) render();
    else { const m = document.querySelector(".mins"), w = document.querySelector(".why");
      if (m) m.textContent = dur(S.draft.min||30); if (w) w.textContent = S.draft.why||"";
      document.querySelectorAll('.add .cat').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === S.draft.cat)));
      const needPrep = S.draft.cat === "lesson", hasPrep = !!$("#withprep");
      if (needPrep !== hasPrep) render(); }
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "fixed") { S.draft.fixed = e.target.value; render(); }
  if (e.target.id === "withprep") { S.draft.withPrep = e.target.checked; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "title") { e.preventDefault(); submitDraft(); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "phrase") { e.preventDefault(); S.phrase = parsePhrase(S.phraseText); render(); }
  if (e.key === "Enter" && e.target.id && e.target.id.startsWith("act-")) { e.preventDefault(); saveActual(e.target.id.slice(4), e.target.value); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[data-act="edit"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && (S.editing || S.showSettings)) { S.editing = null; S.showSettings = false; render(); }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const stopper = e.target.closest("[data-stop]");
  if (el.dataset.act === "closesheet" && stopper && el.classList.contains("scrim")) return; // click inside sheet
  if (el.dataset.act === "edit" && stopper && stopper !== el && el.contains(stopper)) return; // click inside "actual" form
  const act = el.dataset.act, id = el.dataset.id;
  if (act !== "add") S.flash = "";
  if (!/^toast|^voice/.test(act) && act !== "toastundo") S.toast = null;
  switch (act) {
    case "prev": goDate(addDays(S.date,-1)); break;
    case "next": goDate(addDays(S.date,1)); break;
    case "today": goDate(dkey(new Date())); break;
    case "cat": S.draft.cat = el.dataset.cat; S.draft.catManual = true; render(); break;
    case "min": S.draft.min = r5((S.draft.min||30) + Number(el.dataset.d)); S.draft.minManual = true; render(); break;
    case "clearfixed": S.draft.fixed = ""; render(); break;
    case "add": submitDraft(); break;
    case "preset": addPreset(Number(el.dataset.i)); break;
    case "done": toggleDone(id); break;
    case "actual": saveActual(id, document.getElementById("act-"+id)?.value); break;
    case "skipactual": S.askingDone = null; render(); break;
    case "up": move(id,-1); break;
    case "down": move(id,1); break;
    case "edit": { S.editing = id; const t = S.tasks.find(x => x.id === id); const r = t && t.rid ? S.recurring.items.find(x => x.id === t.rid) : null; S.editDays = r ? [...r.days] : []; render(); break; }
    case "ecat": { const t = S.tasks.find(x => x.id === S.editing); if (t) { t._cat = el.dataset.cat; document.querySelectorAll('.sheet .cat').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === el.dataset.cat))); } break; }
    case "eday": { const x = Number(el.dataset.day); S.editDays = S.editDays.includes(x) ? S.editDays.filter(y => y !== x) : [...S.editDays, x];
      el.setAttribute("aria-pressed", String(S.editDays.includes(x))); break; }
    case "saveedit": { const t = S.tasks.find(x => x.id === S.editing); if (t) {
        const title = $("#e-title").value.trim(); if (title) t.title = title;
        t.min = r5(Number($("#e-min").value) || t.min); t.fixed = $("#e-fixed").value || "";
        if (t._cat) { t.cat = t._cat; } delete t._cat;
        const isPrep = String(t.rid||"").endsWith("p");
        if (!isPrep) {
          const days = [...new Set(S.editDays)];
          if (t.rid && days.length) { S.recurring = {items:S.recurring.items.map(r => r.id === t.rid ? {...r, title:t.title, cat:t.cat, min:t.min, fixed:t.fixed, days} : r)}; delete t.custom; saveRecurring(); }
          else if (t.rid && !days.length) { const rid = t.rid; delete t.rid; delete t.custom; S.recurring = {items:S.recurring.items.filter(r => r.id !== rid)}; saveRecurring(); }
          else if (!t.rid && days.length) { const it = addRecurring({title:t.title, cat:t.cat, min:t.min, fixed:t.fixed, days, prep:false}); t.rid = it.id; }
        } else t.custom = true;
        saveDay(); refreshToday(); }
      S.editing = null; render(); break; }
    case "delete": { const t = S.tasks.find(x => x.id === S.editing); if (t && t.rid) S.skip.push(t.rid);
      S.tasks = S.tasks.filter(x => x.id !== S.editing); S.editing = null; saveDay(); render(); break; }
    case "recdel": removeRecurring(id); render(); break;
    case "closesheet": { const t = S.tasks.find(x => x.id === S.editing); if (t) delete t._cat; S.editing = null; S.showSettings = false; render(); break; }
    case "settings": S.showSettings = true; S.backupMsg = ""; render(); break;
    case "savesettings": {
      const st = $("#s-start").value || S.settings.dayStart, en = $("#s-end").value || S.settings.dayEnd;
      S.settings = {dayStart:st, dayEnd: toMin(en) > toMin(st) ? en : S.settings.dayEnd,
        gap: Math.max(0, Math.min(60, Number($("#s-gap").value)||0)), afterLesson: Math.max(0, Math.min(60, Number($("#s-after").value)||0))};
      saveSettings(); S.showSettings = false; render(); break; }
    case "carry": carryOver(); break;
    case "backup": doBackup(); break;
    case "restore": doRestore(); break;
    case "example": fillExample(); break;
    case "parse": S.phrase = parsePhrase(S.phraseText); render(); break;
    case "voice": if (VOICE.state === "error") VOICE.state = "idle"; voiceStart(); break;
    case "voicestop": voiceStop(); break;
    case "voicecancel": voiceCancel(); break;
    case "toastundo": if (S.toast) { undoSnapshot(S.toast.undo); S.toast = null; S.flash = "Отменено."; } render(); break;
    case "toastclose": S.toast = null; render(); break;
    case "toastopen": { const d = S.toast && S.toast.date; S.toast = null; if (d) goDate(d); else render(); break; }
    case "cancelphrase": S.phrase = null; render(); setTimeout(() => { const el = document.getElementById("phrase"); if (el) el.focus(); }, 0); break;
    case "clearphrase": S.phrase = null; S.phraseText = ""; VOICE.msg = ""; render(); setTimeout(() => { const el = document.getElementById("phrase"); if (el) el.focus(); }, 0); break;
    case "applyphrase": { const r = applyActions(S.phrase || []); S.phrase = null; S.phraseText = "";
      S.flash = r.n ? `Готово: ${r.n} ${plural(r.n,"изменение","изменения","изменений")}${r.firstDate && r.firstDate !== S.date ? " — смотрите " + relLabel(r.firstDate) : ""}.` : "Нечего применять.";
      render(); break; }
    case "syncon": { if (S.syncBusy) break;
      const repo = $("#s-repo").value, token = $("#s-token").value, pass = $("#s-pass").value;
      S.syncBusy = true; S.syncMsg = ""; render();
      SYNC.connect(repo, token, pass).then(() => { S.syncMsg = SYNC.ok ? "Синхронизация подключена." : SYNC.status; if (!SYNC.ok) SYNC.disconnect(); })
        .catch(err => { S.syncMsg = (err && err.message) || "Не получилось подключить."; SYNC.disconnect(); })
        .finally(() => { S.syncBusy = false; render(); });
      break; }
    case "syncnow": SYNC.run(); break;
    case "syncoff": SYNC.disconnect(); S.syncMsg = "Синхронизация на этом устройстве отключена. Данные остались на устройстве."; render(); break;
  }
});

/* ---------- boot ---------- */
store.watch("settings", d => { S.settings = cleanSettings(d); render(); });
store.watch("stats", d => { S.stats = cleanStats(d); render(); });
store.watch("recurring", d => { S.recurring = cleanRecurring(d); refreshToday(); render(); });
watchDay();
SYNC.load();
render();
SYNC.run();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") SYNC.run(); });
window.addEventListener("online", () => SYNC.run());
setInterval(() => { if (document.visibilityState === "visible") SYNC.run(); }, 120000);
setInterval(() => { if (S.date === dkey(new Date()) && !S.editing && !S.showSettings && document.activeElement?.tagName !== "INPUT") render(); }, 60000);

(async () => { try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e) {} })();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
